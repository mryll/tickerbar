[package]
name = "tickerbar"
version = "0.2.0"
edition = "2021"
description = "A multi-market price ticker for Waybar (crypto, stocks, indices, commodities, forex, rates) — no API key"
license = "MIT"
repository = "https://github.com/mryll/tickerbar"
keywords = ["waybar", "crypto", "finance", "wayland", "hyprland"]
categories = ["command-line-utilities"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dirs = "6.0"
fs2 = "0.4"
unicode-width = "0.2"

[dev-dependencies]
mockito = "1.5"
assert_cmd = "2.0"
predicates = "3.1"

[features]
integration = []

[profile.release]
strip = true
lto = true
opt-level = "s"

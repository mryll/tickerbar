# tickerbar config — copy to ~/.config/tickerbar/config.toml
#
# The crypto / Argentine-dollar / forex providers below work with NO API key.
#
# STOCKS: there is currently no reliable no-key stock source. Stooq is best-effort and is
# often behind an anti-bot wall (quotes then show as "n/d"). For reliable stock/index
# quotes, use the `finnhub` provider with a free API key exported as FINNHUB_TOKEN
# (https://finnhub.io, free tier ~60 req/min). Both stock options are shown commented out
# at the bottom. tickerbar is NOT a live trading feed.

[display]
mode = "fixed"          # "fixed" | "rotate"
rotate_interval = 5     # seconds per asset (rotate mode only)
max_on_bar = 3          # assets shown on the bar (fixed mode)
icons = "nerd"          # "nerd" | "emoji" | "ascii"
# Bar placeholders: {label} {price} {change_pct} {arrow} {glyph}
bar_format = "{glyph} {label} {price} {arrow}{change_pct}"

[[asset]]
label = "BTC"
provider = "coingecko"
id = "bitcoin"
quote = "usd"

[[asset]]
label = "ETH"
provider = "coingecko"
id = "ethereum"
quote = "usd"

[[asset]]
label = "BTC/ARS"
provider = "coingecko"
id = "bitcoin"
quote = "ars"          # CoinGecko's market ARS (≈ official), NOT the blue dollar

[[asset]]
label = "Blue"
provider = "dolarapi"
casa = "blue"
side = "sell"          # "buy" | "sell" | "mid"

[[asset]]
label = "MEP"
provider = "dolarapi"
casa = "bolsa"
side = "sell"

[[asset]]
label = "EUR/USD"
provider = "frankfurter"
base = "eur"
quote = "usd"

# ----- Stocks / indices (opt-in) -------------------------------------------------------
# Option A — Stooq, no key, best-effort (often blocked → shows "n/d"):
# [[asset]]
# label = "AAPL"
# provider = "stooq"
# symbol = "aapl.us"
#
# Option B — Finnhub, reliable, free key required. Export the token first:
#   export FINNHUB_TOKEN=your_free_token   # in your shell / Waybar environment
# [[asset]]
# label = "AAPL"
# provider = "finnhub"
# symbol = "AAPL"
#
# [[asset]]
# label = "S&P500"
# provider = "finnhub"
# symbol = "^GSPC"

# tickerbar config — copy to ~/.config/tickerbar/config.toml
#
# Every provider below works with NO API key, including stocks/indices (CNBC).
# Stock symbols: plain tickers (AAPL, MSFT); indices use a leading dot (.SPX, .IXIC, .DJI).
# tickerbar is NOT a live trading feed — quotes are delayed/best-effort.

[display]
mode = "fixed"          # "fixed" | "rotate"
rotate_interval = 5     # seconds per asset (rotate mode only)
max_on_bar = 3          # assets shown on the bar (fixed mode)
icons = "nerd"          # "nerd" | "emoji" | "ascii"
# Bar placeholders: {label} {price} {change_pct} {arrow} {glyph}
# Format strings are Pango markup: literal &, < and > must be escaped (&amp; &lt; &gt;).
bar_format = "{glyph} {label} {price} {arrow}{change_pct}"
# Optional summary prepended to the bar (empty = off). Placeholders: {avg_change} {avg_arrow}.
# Equal-weighted mean of each asset's daily change %; assets with no daily change are excluded.
# Heterogeneous markets averaged together are a "watchlist mood", not a real portfolio return.
summary_format = ""           # e.g. "Σ {avg_arrow}{avg_change}"
# Curated subset shown on the bar, by label, in this order. Empty = all assets (config order).
# Tooltip is unaffected (always all assets, config order). Unknown labels are ignored.
bar = []                      # e.g. ["BTC", "Blue", "S&P500"]
# Layout combining the assets block {bar} and the summary block {summary}. Default = summary
# first; "{bar}   {summary}" puts it at the end. Empty blocks drop their literals (no dangling sep).
bar_layout = "{summary}   {bar}"
tooltip_rows_per_column = 0   # wrap the tooltip into a new column every N lines (0 = single)
tooltip_max_columns = 0       # cap columns side-by-side; extras wrap into a band below (0 = unlimited)
tooltip_range = false         # append a dim intraday low–high range per row (CNBC-backed assets)

# Don't poll a market while it's closed (built-in calendars: crypto 24/7, BYMA, US, forex).
# Closed panels show "⏸ closed" in the tooltip and serve the last close from cache.
[market_hours]
enabled = true
# Disable gating for a single provider (e.g. if you track a non-US stock via cnbc/finnhub):
# [market_hours.providers.cnbc]
# enabled = false

[[asset]]
label = "BTC"
provider = "coingecko"
id = "bitcoin"
quote = "usd"

[[asset]]
label = "ETH"
provider = "coingecko"
id = "ethereum"
quote = "usd"

[[asset]]
label = "BTC/ARS"
provider = "coingecko"
id = "bitcoin"
quote = "ars"          # CoinGecko's market ARS (≈ official), NOT the blue dollar

[[asset]]
label = "Blue"
provider = "dolarapi"
casa = "blue"
side = "sell"          # "buy" | "sell" | "mid"

[[asset]]
label = "MEP"
provider = "dolarapi"
casa = "bolsa"
side = "sell"

[[asset]]
label = "EUR/USD"
provider = "frankfurter"
base = "eur"
quote = "usd"

# Argentine market (BYMA) via data912 — no API key, ARS, ~2h delay.
# panel: acciones | bonos | cedears | corp
[[asset]]
label = "ALUA"
provider = "data912"
panel = "acciones"
symbol = "ALUA"

[[asset]]
label = "GD35"
provider = "data912"
panel = "bonos"
symbol = "GD35"

[[asset]]
label = "MELI"
provider = "data912"
panel = "cedears"
symbol = "MELI"

# Stocks / indices via CNBC — no API key.
[[asset]]
label = "AAPL"
provider = "cnbc"
symbol = "AAPL"

[[asset]]
label = "S&P500"
provider = "cnbc"
symbol = ".SPX"

# Commodities via CNBC — no API key. Friendly names (or any raw CNBC symbol like "@GC.1").
# commodity: gold silver wti brent natgas copper platinum palladium
[[asset]]
label = "Gold"
provider = "commodity"
symbol = "gold"

[[asset]]
label = "WTI"
provider = "commodity"
symbol = "wti"

# Indices via CNBC — index: vix sp500 nasdaq dow dax ftse nikkei hangseng
[[asset]]
label = "VIX"
provider = "index"
symbol = "vix"

# Treasury yields via CNBC — rate: us10y us2y us30y us5y (displayed as a percent, e.g. 4.53%)
[[asset]]
label = "US 10Y"
provider = "rate"
symbol = "us10y"

# ----- Other stock providers (opt-in) --------------------------------------------------
# Finnhub — reliable, needs a free key exported as FINNHUB_TOKEN (token sent via header):
#   export FINNHUB_TOKEN=your_free_token
# [[asset]]
# label = "MSFT"
# provider = "finnhub"
# symbol = "MSFT"
